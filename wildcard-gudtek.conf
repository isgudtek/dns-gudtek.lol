# Apache VirtualHost configuration for wildcard subdomains
# This handles *.gudtek.lol for the URL shortener service

<VirtualHost *:80>
    ServerAdmin webmaster@gudtek.lol
    ServerName gudtek.lol
    ServerAlias *.gudtek.lol

    DocumentRoot /var/www/gudtek.lol/is

    <Directory /var/www/gudtek.lol/is>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

        # Handle subdomain routing
        RewriteEngine On

        # If not accessing the main domain, let PHP handle the redirect
        RewriteCond %{HTTP_HOST} !^gudtek\.lol$
        RewriteCond %{HTTP_HOST} !^www\.gudtek\.lol$
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^.*$ /index.php [L,QSA]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/is_gudtek_error.log
    CustomLog ${APACHE_LOG_DIR}/is_gudtek_access.log combined

    <IfModule mod_headers.c>
        Header set Access-Control-Allow-Origin "*"
    </IfModule>
</VirtualHost>

# SSL Configuration (for HTTPS)
# This will need to be configured with certbot after enabling the site
# Run: certbot --apache -d gudtek.lol -d *.gudtek.lol
#
# Note: Wildcard SSL certificates require DNS validation with certbot
